<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AS 532 AL Trainer</title>

<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1c2420;--mut:#66726b;--line:#dfe3dc;--ok:#2f9e44;--okbg:#e3f5e7;--bad:#d9352b;--badbg:#fde7e5;--acc:#2563eb;--gold:#d99a00}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171a;--card:#1b2227;--ink:#e8edea;--mut:#92a09a;--line:#2b353b;--ok:#4cc16a;--okbg:#17321f;--bad:#f0645a;--badbg:#3a1b19;--acc:#6b9bff;--gold:#f0b429}}
:root[data-theme=dark]{--bg:#12171a;--card:#1b2227;--ink:#e8edea;--mut:#92a09a;--line:#2b353b;--ok:#4cc16a;--okbg:#17321f;--bad:#f0645a;--badbg:#3a1b19;--acc:#6b9bff;--gold:#f0b429}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Inter,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:14px;align-items:center;justify-content:space-between;z-index:5;border-bottom:1px solid var(--line)}
.top b{font-weight:800}.stat{display:flex;gap:14px;font-weight:600;font-size:15px}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:14px;margin:4px 0 14px}
.btn{border:0;border-bottom:4px solid rgba(0,0,0,.25);border-radius:14px;padding:12px 18px;font-weight:800;background:var(--acc);color:#fff;text-transform:uppercase;letter-spacing:.03em;font-size:14px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
.btn[disabled]{background:var(--line);color:var(--mut);border-bottom-color:transparent;cursor:default}
.btn.full{width:100%}
.unit{margin:18px 0}
.uh{border-radius:16px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.uh b{display:block;font-size:17px}.uh span{font-size:13px;opacity:.92}
.les{display:flex;gap:16px;justify-content:center;padding:16px 0}
.node{width:68px;height:68px;border-radius:50%;border:0;border-bottom:6px solid rgba(0,0,0,.28);font-size:26px;color:#fff;font-weight:800;position:relative}
.node.lock{background:var(--line)!important;color:var(--mut);border-bottom-color:rgba(0,0,0,.12);cursor:default}
.node.cur{box-shadow:0 0 0 6px color-mix(in srgb,currentColor 0%,transparent),0 0 0 4px var(--bg),0 0 0 7px var(--gold)}
.tools{display:flex;gap:10px;margin:8px 0}
.tools .btn{flex:1}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.quiz{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto}
.quiz.on{display:block}
.qin{max-width:560px;margin:0 auto;padding:14px 16px 190px;min-height:100%}
.qh{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.x{background:none;border:0;font-size:24px;color:var(--mut);padding:4px 8px}
.qt{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.qq{font-size:20px;font-weight:800;margin:0 0 20px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:16px}
.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.slots{min-height:50px;border-radius:14px;border:2px dashed var(--line);padding:8px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.slots .opt{margin:0}
.slots .hint{color:var(--mut);font-size:14px;padding:6px}
.fb{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:30;border-top:1px solid var(--line);background:var(--card)}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fbi{max-width:560px;margin:0 auto}
.fbt{font-weight:800;font-size:18px;margin-bottom:4px}.fb.ok .fbt{color:var(--ok)}.fb.bad .fbt{color:var(--bad)}
.fbe{font-size:14px;max-height:28vh;overflow-y:auto;margin-bottom:6px}
.fbr{font-size:12px;color:var(--mut);margin-bottom:10px}
.end{text-align:center;padding-top:40px}
.end .big{font-size:56px}.end h2{margin:8px 0}
.cards{display:flex;gap:10px;justify-content:center;margin:20px 0}
.cards div{flex:1;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 6px}
.cards b{display:block;font-size:22px}.cards span{font-size:12px;color:var(--mut)}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:30px}
.sec{margin:20px 0 8px;font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px;text-align:left}
.mode b{display:block;font-size:16px}.mode span{font-size:13px;color:var(--mut)}
.mode.hot{border-color:var(--gold)}
.mode.wide{grid-column:1/3}
.dr{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.dr span{color:var(--gold);letter-spacing:2px;white-space:nowrap;font-size:13px}
.tg{white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)}
.tg input{width:20px;height:20px}
.num{width:100%;font:inherit;font-size:22px;font-weight:800;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
.num:focus{outline:0;border-color:var(--acc)}
.ansbox{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;font-size:20px;font-weight:800;margin-bottom:10px}
.tm{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:-10px 0 16px}
.tm i{display:block;height:100%;background:var(--bad);width:100%}
.dn{background:var(--okbg);border:2px solid var(--ok);border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:14px}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.qrh{margin:22px 0 6px;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--card) 70%,#0b1220 30%);border:2px solid var(--line)}
.qh2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}.qh2 b{font-size:18px}.qh2 span{font-size:12px;color:var(--mut)}
.dr small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}
.lamps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-6px 0 14px}
.lamps em{font-style:normal;color:var(--mut);font-weight:800}
.lamps.big{justify-content:center;padding:26px 0;margin:0 0 18px;background:#111;border-radius:16px}
.lamps.big .ann{transform:scale(1.6);transform-origin:center}
.ann{display:inline-flex;align-items:center;justify-content:center;background:#050505;border:1px solid #333;border-radius:3px;padding:6px 10px;font:700 13px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;white-space:nowrap}
.ann.r{color:#ff3b30}.ann.a{color:#ffc21a}.ann.g{color:#3ee26a}
.ann.ab{color:#ffc21a;border:2px solid #ffc21a;font-size:15px}
.ann.ar{color:#050505;background:#ffc21a;border-color:#ffc21a;font-size:16px;padding:4px 8px}
.ann.o{background:#f39a1e;color:#111;border-color:#f39a1e}
.ann.rv{flex-direction:column;padding:4px 6px;color:#ff3b30;gap:1px}.ann.rv b{font-size:11px;line-height:1.05}
.ann.ha,.ann.hg{flex-direction:column;padding:0;width:62px;overflow:hidden}
.ann.ha i,.ann.hg i{display:block;width:100%;height:16px;background:repeating-linear-gradient(135deg,#ffc21a 0 4px,#050505 4px 8px)}
.ann.hg i{background:repeating-linear-gradient(135deg,#9aa 0 4px,#050505 4px 8px)}
.ann.ha b,.ann.hg b{padding:5px 4px;font-size:11px}.ann.ha b{color:#ffc21a}.ann.hg b{color:#3ee26a}
.ann.y{flex-direction:column;background:transparent;border:0;gap:3px;color:var(--ink);padding:2px 4px}
.ann.y i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6a8,#ffd400 55%,#b38f00);border:2px solid #333}
.ann.y b{font-size:10px}
.gauge{display:inline-block;background:#050505;color:#fff;border:1px solid #333;border-radius:4px;padding:5px 8px;font:700 12px ui-monospace,Menlo,monospace}
.opt.lop{text-align:center;background:#111;border-color:#333}
.opt.lop.sel{border-color:var(--acc)}.opt.lop.good{border-color:var(--ok)}.opt.lop.bad{border-color:var(--bad)}
.u-li{color:#e5322d;font-weight:800}.u-la{color:#f07c00;font-weight:800}.u-ld{font-weight:800;text-decoration:underline}.u-cf{color:#1f9d3a;font-weight:800}
.fbe .ann{vertical-align:middle;margin-right:4px}
.lop .ann.y,.lamps.big .ann.y{color:#eee}
.qrh.fm{background:color-mix(in srgb,var(--card) 80%,#0f3d2e 20%)}
</style></head><body>

['COM','COM','a','caut','Failure of the communication system','—'],

['PWCPT','PW CPT','a','caut','Power computer failure','11'],
['RBSAFE','RB SAFE','a','caut','Rotor brake control lever in braking position or not properly in safe gate','33'],
['ROTBR','ROT BR','a','caut','Hydraulic pressure in rotor brake system','33'],
['SERVO','SERVO','a','caut','Seizing of one or more main/tail rotor servocontrols, or loss of one cylinder in tail servocontrol','16'],
['TGBT','TGB T°','a','caut','TGB oil temperature exceeds 120 °C','14'],
['THROT','THROT','a','caut','One or both fuel flow control levers not set to automatic governing position','33'],
['TRNG','TRNG','a','caut','Training function in use','11'],
['WDSCR','WDSCR','a','caut','Anti-icing loss on one or more windshield panels: check light on sub-panel','34'],
['AUXHP','AUX.HP','a','hyd','Pressure drops in auxiliary hydraulic system pump','16'],
['AUXP','AUX.P','a','hyd','Auxiliary system electric pump disconnected','16'],
['LHHMP','LH.HMP','a','hyd','Pressure drops in LH hydraulic system pump','16'],
['APHP','AP.HP','a','hyd','Pressure drops in AP hydraulic system','18'],
['LHP','LH.P','a','hyd','Pressure drops in LH hydraulic system','17'],
['LHLEV','LH.LEV','a','hyd','Hydraulic fluid level less than 4 litres in LH reservoir','17'],
['RHP','RH.P','a','hyd','Pressure drops in RH hydraulic system','16'],
['RHLEV','RH.LEV','a','hyd','Hydraulic fluid level less than 2 litres in RH reservoir','16'],
['BLD','BLD','g','sub','LH or RH engine bleed valve open','10'],
['OFS','OFS','g','sub','LH or RH bleed valve closing control threshold offset','10'],
['OVSP','OVSP','ha','sub','Free turbine overspeed (light FLASHES) or overspeed sensor not set, N2 below 15 % (light STEADY)','9'],
['GOV','GOV','ha','sub','Loss of redundancy in RH or LH engine governor','9'],
['NORMG','NORM','hg','sub','Test sequence correct','—'],
['NORMA','NORM','ha','sub','Failure of one N2 overspeed circuit','—'],
['SPLYA','SPLY','ha','sub','Emergency battery overheating or supply failure','24'],
['SPLYG','SPLY','hg','sub','Emergency battery supplying aircraft system','24'],
['START','START','g','sub','Engine starting light','—'],
['PRESS','PRESS','a','fuel','Low fuel pressure (P < 150 mbar)','12'],
['FILT','FILT','a','fuel','Fuel filter clogging (ΔP = 140 mbar)','12'],
['LOWF','↓','ar','fuel','Fuel low level (feeder tank below about 90 litres)','12'],
['TR1','TR.1','y','elec','Transformer-rectifier 1 failure','22'],
['TR2','TR.2','y','elec','Transformer-rectifier 2 failure','22'],
['ALT1','ALT.1','y','elec','Alternator 1 failure','23'],
['ALT2','ALT.2','y','elec','Alternator 2 failure','23'],
['BATL','BAT','y','elec','Main battery failure','20'],
['IBAR','INTER-BAR','y','elec','Coupling (inter-bar) contactor open','21'],
['SHED','SHEDDING','y','elec','SHEDDING light (DC consumer shedding)','21'],
['CMFD','CHECK MFD','o','mfd','FND/NAVD cross monitoring fault','27'],
['CVNE','CHECK VNE','o','mfd','No VNE computation: the red line is frozen on the absolute VNE','27'],
['COLL','COLL LINK','o','mfd','Decoupling of collective/yaw, roll and pitch axis inactive','27'],
['AHRSX','AHRS ↔','o','mfd','Loss of consistency between the AHRS','28'],
['ADCX','ADC ↔','o','mfd','Total pressure ports of a pitot head obstructed (ADC discrepancy)','28'],
['XXXX','XXXX ↔','o','mfd','Sensor cross-talk discrepancy','27'],
['AHRSR','AHRS 1','r','mfd','One AHRS failure','26'],
['ADCR','ADC 1','r','mfd','One ADC failure','27'],
['FCPR','FCP 1','r','mfd','One FCP failure: altimeter, course and DH/DA settings revert to power-up settings','26'],
['LOCR','LOC 1','r','mfd','LOC failure: check with another navigation system','26'],
['RAD','RAD','rv','mfd','Radio altimeter failure','25'],
['MFDF','MFD SEVERE FAILURE','r','mfd','Display failure','25'],
['CEID','CHECK EID','a','vms','Loss of EID cross talk','31'],
['SOEID','SWITCH OFF EID 1','a','vms','One EID failure: switch off the failed EID','31'],
['EIDF','EID FAIL','r','vms','One EID failure','31'],
['CAMC','CHECK AMC','a','vms','AMC failure or discrepancy: set AMC switch 1/N/2 on RCU to valid position','31'],

].map(a=>({id:a[0],t:a[1],s:a[2],g:a[3],m:a[4],tab:a[5]}));
const LMAP={};LIGHTS.forEach(l=>LMAP[l.id]=l);
/* Urgency wording (QRH introduction) */
const URG={LI:'LAND IMMEDIATELY',LA:'LAND AS SOON AS POSSIBLE',LD:'LIMIT DURATION OF FLIGHT',CF:'CONTINUE THE FLIGHT'};
/* qm(lights, question, [correct, wrong, wrong, wrong], explanation, ref) · qt(lights, statement, true/false, explanation, ref)
   lights: annunciator ids, or '#text' for a gauge reading */
const qm=(l,q,o,e,r)=>({t:'mc',l,q,o,e,r,en:1}), qt=(l,q,a,e,r)=>({t:'tf',l,q,a,e,r,en:1});
const QUNITS=[
{n:'Urgency terms & general',d:'Land immediately … continue',c:'#334155',q:[
 qm([],'What does LAND IMMEDIATELY mean?',['Continued flight may not be possible. Ditching or landing in hazardous terrain is preferable to continuing flight','Land at the nearest site where a safe landing can be accomplished','Land at the nearest site where technical assistance may be expected','Extended flight is not recommended'],'This is the most urgent of the four QRH terms.','QRH Introduction'),
 qm([],'What does LAND AS SOON AS POSSIBLE mean?',['Land at the nearest site where a safe landing can be accomplished','Ditching is preferable to continuing flight','Landing site and duration of flight are at the pilot’s discretion','Continue to destination'],'Second level of urgency.','QRH Introduction'),
 qm([],'What does LIMIT DURATION OF FLIGHT mean?',['Extended flight is not recommended. Land at the nearest site where technical assistance may be expected; site and duration at pilot’s discretion','Land at the nearest safe site','Land immediately, even in hazardous terrain','No restriction, continue the mission'],'Third level of urgency.','QRH Introduction'),
 qm(['WARN','CAUT'],'WARN or CAUT illuminates. How is it acknowledged?',['Press the light on either panel — this resets the caution alerting function','Pull the circuit breaker','Switch the AMC to N','It goes out by itself after 10 s'],'Pressing the light resets the alerting function for the next failure.','QRH Introduction, note'),
 qm([],'A circuit breaker has popped. When may it be reset?',['Only if the affected system is required for flight, only once, and only if there is no indication of electrical fire','Always, up to three times','Never in flight','Only after landing'],'The electrical chapter repeats it: do not perform more than one reset attempt.','QRH Introduction, note; Tab 20'),
 qm([],'Rotor speed aural warning range (underspeed):',['75.5–92.5 % (200–245 rpm)','83–92.5 %','92.5–103.8 %','60–75 %'],'Overspeed aural warning: above 109.5 % (290 rpm).','QRH Aural warning'),
 qm(['LG'],'When does the landing gear aural warning sound?',['Gear not extended with airspeed 60 kt or less AND height 300 ft (90 m) or lower','Gear not extended below 500 ft','Gear extended above 110 kt','Gear not extended below 100 kt'],'It sounds for 3 s, is reactivated at 10 ft (3 m) and can be silenced with the L/G pushbutton. L/G flashes as soon as IAS < 60 kt.','QRH Aural warning'),
 qm([],'When does the power-limit gong sound?',['When MCP or TOP (whichever applicable) is exceeded','When NR exceeds 109.5 %','When OEI 2 min 30 s starts','When TOT exceeds 750 °C'],'Gong = power limit exceeded.','QRH Aural warning'),
 qm([],'Pulling the EMERGENCY CUT-OFF gang bar backward:',['Cuts off the main battery and alternators 1 and 2; isolates all consumers except bus bars PP1 and PP11 (direct battery)','Shuts down both engines','Cuts off everything including the emergency battery','Extends the landing gear'],'Used in smoke and electrical failure procedures.','QRH Emergency cut-off gangbar'),
 qm([],'When may the GENERAL CUT-OUT handle be used?',['Only on the ground, or very close to the ground in the event of a hazardous landing','At any altitude for a fire','For a single engine failure in cruise','To reset the AFCS'],'It shuts off both engines and all electrical consumers except fire extinguishing, cockpit utility lights, emergency gear extension and emergency-battery consumers.','QRH General cut-out handle'),
 qt([],'Doors and emergency exits should be jettisoned before touchdown in an emergency landing or ditching.',false,'CAUTION: do NOT jettison before touchdown, to prevent possible impact with the rotors.','QRH Emergency evacuation'),
 qm([],'Which consumers stay powered after pulling the GENERAL CUT-OUT handle?',['Engine fire extinguishing, cockpit utility lights, emergency L/G extension, emergency-battery consumers (ISIS, triple indicator…)','Both engines and the AFCS','Only the radios','Nothing at all'],'Both engines are shut off.','QRH General cut-out handle')]},
{n:'Fires & smoke',d:'Tabs 1–3',c:'#b91c1c',q:[
 qm(['WARN','F1'],'FIRE 1 with WARN and aural on the ground. First action?',['Fuel shutoff valve — CLOSE','Rotor brake — APPLY','GENERAL CUT-OUT handle — PULL','Booster pumps — OFF'],'Then NORM extinguisher push in, both fuel flow levers SHUTDOWN, booster pumps OFF, heater OFF…','QRH Tab 1'),
 qm(['F2'],'Engine fire on the ground: FIRE light remains on after the first extinguisher. Next action?',['Illuminated EMER fire extinguisher switch — PUSH IN','Restart the engine','Wait 5 minutes','Open the cowlings'],'Then evacuation announcement, GENERAL CUT-OUT handle PULL, evacuate, fight fire from outside.','QRH Tab 1'),
 qm(['F1'],'Engine fire during take-off, in hover or approach, when a safe landing is possible:',[URG.LI,URG.LA,'Climb to safe altitude first','Continue to destination'],'When the aircraft is stopped, follow the ground fire procedure.','QRH Tab 1'),
 qm(['F2'],'Engine fire in flight: what is the first item before acting on the affected engine?',['Attain single engine flight condition','Pull the GENERAL CUT-OUT handle','Press EMER extinguisher','Lower the landing gear'],'Then: fuel shutoff valve close, NORM push in, chronometer start, fuel flow lever shutdown, booster pumps OFF, discharge light check, heater OFF.','QRH Tab 1'),
 qm(['F1'],'Engine fire in flight, actions done, the FIRE light goes out. Urgency?',[URG.LA,URG.LI,URG.LD,URG.CF],'If FIRE does not go out after 1 min: EMER extinguisher; if still on after 1 min: LAND IMMEDIATELY.','QRH Tab 1'),
 qm(['F1'],'Why is the chronometer started in the in-flight engine fire procedure?',['To time 1 min before using the EMER extinguisher if the FIRE light stays on','To time the OEI 2 min 30 s rating','To time the restart','To log fuel consumption'],'"If the FIRE light does not go out after 1 min" — EMER push in.','QRH Tab 1'),
 qm(['WARN','BF1'],'Only B FIRE 1 illuminates (with WARN and aural). What is it and what do you do?',['Possible detection fault or false alarm: watch the second B FIRE light — '+URG.LD,'MGB fire: '+URG.LI,'Engine fire: close fuel shutoff valve','Ignore it'],'A real MGB fire is confirmed by both B FIRE 1 and B FIRE 2 (they may illuminate a few seconds apart).','QRH Tab 2'),
 qm(['WARN','BF1','BF2'],'B FIRE 1 + B FIRE 2. Actions?',['Landing gear DOWN — '+URG.LI+' — after landing: evacuation announcement, GENERAL CUT-OUT handle PULL','Push NORM extinguisher and continue','Reduce power to Vy and continue','Shut down engine 1'],'Fire in MGB compartment.','QRH Tab 2'),
 qm(['CAUT','FIRED'],'CAUT + FIRE D. What is the first action?',['Perform the 4 FIRE tests (engines and MGB)','Land immediately','Pull fire extinguisher','Shut down both engines'],'One test incorrect → LIMIT DURATION. All OK, or lamp stays lit after good tests (reversal to secondary supply) → CONTINUE.','QRH Tab 2'),
 qm([],'Smoke in the helicopter on the ground or in hover over a possible landing site:',[URG.LI+': EMERGENCY CUT-OFF gangbar PULL, fuel flow levers SHUTDOWN, all electrical power levers OFF, booster pumps OFF, open all doors','Fly at Vy and open windows','Switch ventilation on and continue','Pull the gangbar and continue the flight'],'RFM 3.1 §10.1. NOTE: QRH Rev 1.0 shows the GENERAL CUT-OUT handle here — the approved RFM says the EMERGENCY CUT-OFF gangbar.','RFM 3.1 §10.1 / QRH Tab 3'),
 qm([],'Smoke of NON-electrical origin, immediate landing impossible:',['Fly ≈ Vy, ventilation ON, cockpit ventilation outlets OPEN, cockpit sliding windows CLOSE — '+URG.LA,'Fly ≈ Vy, windows OPEN, sideslip','Gangbar AFT immediately','Descend at VNE'],'Electrical smoke differs: Vy, sliding windows OPEN, induce a sideslip, then isolate sources.','RFM 3.1 §10.2.1'),
 qm([],'Smoke of ELECTRICAL origin: first three items?',['Fly ≈ Vy — cockpit sliding windows OPEN — induce a sideslip','Land immediately — cut-out handle — evacuate','Ventilation ON — outlets OPEN — windows CLOSE','Battery OFF — alternators OFF — TRs OFF'],'Then the isolation flowchart: battery first, then alternators, then TRs. NOTE: QRH Rev 1.0 says CLOSE the windows — the approved RFM 3.1 §10.2.2 says OPEN.','RFM 3.1 §10.2.2 / QRH Tab 3'),
 qm([],'Electrical smoke flowchart, first step:',['EMERG CUT-OFF: ALT.1, ALT.2, BAT switches AFT; EMERG.BAT SPLY; ALT.1, ALT.2, TR.1, TR.2 OFF; COUPLING OFF','BATT.EXT.PWR OFF only','TR.1 OFF only','Pull GENERAL CUT-OUT handle'],'If smoke does not diminish: everything back FORWARD/ON, EMERG.BAT FORCED, BATT.EXT.PWR OFF, LAND ASAP.','QRH Tab 3'),
 qm([],'Why must you be configured for 85 % N1 before setting both the gangbar and BAT/EXT.PWR off?',['Engine electronic governing loses power and both engines go to an intermediate value (≈85 %); only the pilot triple indicator NR/N2 remains','The rotor brake engages','Both engines flame out','The AFCS disengages only'],'Emergency governing mode — CAUTION in Tab 3.','QRH Tab 3'),
 qm([],'Electrical smoke: in which order are components isolated?',['Battery, then alternators, then TRs','TRs, then battery, then alternators','Alternators, then TRs, then battery','All at once'],'Wait long enough between steps to make sure no smoke reappears.','QRH Tab 3, note')]},
{n:'Engine failures',d:'Tabs 4–7',c:'#047857',q:[
 qm(['WARN','DIFF','EP1','PWR2'],'Typical symptoms of a single engine failure?',['N1 may drop (sometimes to IDLE), TOT and torque drop, NR may drop with NR min aural, PWR light of the remaining engine','TOT rises sharply on the failed engine','Both N1 increase','MGB P and MGB C'],'The remaining engine power increases automatically (PWR1/PWR2).','QRH Tab 4'),
 qm([],'A yellow clock flag appears on the EID after a single engine failure. Meaning?',['Intermediate contingency rating exceeded; it flashes 5 s before the time limit; after 2 min 30 s the circle is full and fixed','Fuel low level','MCP exceeded on both engines','Training mode active'],'Reduce to OEI CONT before the limit.','QRH Tab 4, note'),
 qm([],'Increasing collective after an engine failure, NR drops below 83 %. Consequence?',['Loss of electric power supply (except battery)','Automatic restart','Rotor brake application','Nothing'],'Keep NR — "Control NR".','QRH Tab 4, note'),
 qm([],'What does VTOSS indicate (with actual weight inserted)?',['Minimum airspeed for a 100 ft/min rate of climb at OEI 2 min 30 s rating','Best range speed','Maximum speed with doors open','Vy + 10 kt'],'Vy is the speed requiring minimum power. OEI level flight may not be possible.','QRH Tab 4, note'),
 qm([],'Engine failure in hover IGE, landing. Steps?',['Control attitude and cushion touchdown; after touchdown neutralize cyclic and collective to minimum; apply wheel brakes','Increase speed to 30 kt nose-down','Climb out at Vtoss','Autorotate'],'Continued flight may be possible — LIMIT DURATION.','QRH Tab 4'),
 qm([],'Engine failure in hover OGE, landing: what airspeed do you gain?',['At least 30 kt (more if height permits, but not above 40 kt), nose-down up to 15–20° max','60 kt','Vy + 10 kt','Stay at zero speed'],'Simultaneously control NR. Near the ground level off, reduce speed, cushion touchdown.','QRH Tab 4'),
 qm([],'Engine failure during take-off with airspeed below 45 kt (before V1):',['Reject: rotate nose up before V1, maintain NR with collective, cushion, neutralize cyclic, collective minimum, brakes','Continue to Vtoss','Accelerate to Vy','Autorotate with gear up'],'Above 45 kt (after V1): establish Vtoss, NR 92.5 %, climb and accelerate to Vy.','QRH Tab 4'),
 qm([],'Engine failure during take-off above 45 kt (after V1): NR to maintain with collective?',['92.5 %','100 %','83 %','109 %'],'Adjust pitch to Vtoss; when obstacles cleared, accelerate to Vy. LIMIT DURATION.','QRH Tab 4'),
 qm([],'Engine failure during approach, landing: airspeed to control?',['Around 40 kt','Vy','60 kt','Vtoss'],'Control NR, heating OFF, failed engine booster pump OFF, gear down, nose wheel locked, parking brake released.','QRH Tab 5'),
 qm([],'Engine failure on approach: continued flight is possible if, at the moment of failure, the height above ground is at least:',['50 ft (depending on OEI performance)','100 ft','300 ft','15 ft'],'Control NR and simultaneously gain climbing speed.','QRH Tab 5'),
 qm([],'Intentional single engine shutdown after malfunction: collective pitch first reduced to about:',['14°','10°','16.5°','17.5°'],'Then heating OFF, shut down: fuel flow lever fast reduction gate SET, control NR, booster pumps OFF, fuel flow lever OFF.','QRH Tab 5'),
 qm([],'Transferring fuel from the tank of the failed engine:',['Failed engine fuel shutoff control PULL, failed engine booster pumps ON, transfer pump ON','Booster pumps OFF, transfer pump OFF','Open the crossfeed with the engine running','Not permitted'],'LIMIT DURATION OF FLIGHT.','QRH Tab 5'),
 qt([],'After an intentional shutdown caused by failure of the free-turbine governing sensors, an in-flight restart may be attempted.',false,'CAUTION: do NOT restart the engine in this case.','QRH Tab 6'),
 qm([],'In-flight restart: the START annunciator goes out when gas generator speed reaches:',['45 %','23 %','65 %','17 %'],'OVSP light off at N2 = NR 23 %; ENG P off at 1.7 bar; TOT ≤ 750 °C during acceleration; THROT + DIFF NG off.','QRH Tab 6'),
 qm([],'In-flight restart: airspeed?',['Approximately Vy','40 kt','Vtoss','VNE − 20 kt'],'Booster pumps ON, fuel pressure check, fuel flow lever in start detent, START, lever forward.','QRH Tab 6'),
 qm([],'Dual engine failure while hovering:',['Hold level attitude, increase collective AS REQUIRED to cushion; after contact collective minimum, wheel brakes','Nose down to 40 kt','Pull GENERAL CUT-OUT in the air','Lower collective fully and keep it'],'QRH Tab 6.','QRH Tab 6'),
 qm([],'Autorotation: collective is reduced to obtain NR below or equal to:',['109 % (290 rpm)','100 %','92.5 %','117 %'],'Check in the descent: gear down, nose wheel locked, parking brake released, artificial horizons zero set.','QRH Tab 6'),
 qm([],'Autorotation final approach speed:',['Vy + 10 kt, into wind','Vy − 10 kt','Vtoss','40 kt'],'Flare at about 130 ft at maximum weight, 70 ft at light weight; adopt ≈15–20° nose-up.','QRH Tab 6'),
 qm([],'Autorotation: wheel brakes after touchdown are applied:',['Below 30 kt','Immediately','Above 40 kt','Never'],'Collective to minimum after touchdown.','QRH Tab 6'),
 qm([],'Autorotation over water — which is correct?',['Open sliding doors on approach; jettison exits after touchdown; apply rotor brake without decreasing collective','Gear down; jettison exits on approach','Unfasten belts before touchdown','Inflate life jackets inside the aircraft'],'Do not inflate life jackets until clear of the aircraft.','QRH Tab 7')]},
{n:'Engine control & fuel',d:'Tabs 7–12',c:'#7c3aed',q:[
 qm(['WARN','EP1','#ENG 1 OIL P 1.5 BAR'],'Engine oil pressure drop. Action?',['Apply INTENTIONAL SINGLE-ENGINE SHUT-DOWN AFTER MALFUNCTION (Tab 5) — '+URG.LD,'Reduce power and continue','Land immediately','Restart the engine'],'ENG P1/ENG P2 = oil pressure drop.','QRH Tab 7'),
 qm(['#ENG 1 OIL P 6.2 BAR'],'Engine oil overpressure. Action?',['Reduce power; if pressure does not decrease, fuel flow lever to fast reduction gate — '+URG.LD,'Shut down immediately','Continue the flight','Land immediately'],'Before landing, if OEI rating likely: fuel flow lever of the reduced engine to Flight.','QRH Tab 7'),
 qm(['#OIL T 120 °C'],'Excessive engine oil temperature. Action?',['Intentional single-engine shutdown (Tab 5) — '+URG.LD,'Reduce power only','Continue the flight','Land immediately'],'QRH Tab 8.','QRH Tab 8'),
 qm(['#TOT 850 °C'],'TOT abnormally high. Action?',['Reduce power; then intentional single-engine shutdown (Tab 5) — '+URG.LD,'Increase NR','Continue','Land immediately'],'QRH Tab 8.','QRH Tab 8'),
 qm(['DIFF','#N1 85.0 %','PWR1','EP1','OVSP'],'N1 not varying from 85 %, or tending to the 2 min 30 s rating, or oscillating. Which failure?',['Major governing system failure','Free turbine sensor failure','Minor governing failure','Power computer failure'],'The other engine governor compensates automatically.','QRH Tab 8'),
 qm(['DIFF','PWR1','OVSP'],'Major governing failure: rotor speed to maintain?',['Between 94 % and 101 %','92.5–103.8 %','100 % exactly','83–109 %'],'Identify the engine by collective variation until PWR1/PWR2; use fuel flow lever / emergency range.','QRH Tab 8'),
 qm([],'Major governing failure landing procedure — final approach:',['Move affected engine fuel flow control forward until its torquemeter shows 20 %','Set it to shutdown','Leave at fast reduction gate','Set both levers to flight'],'Descent: fast reduction gate. After landing: at 10° collective, shut down the affected engine.','QRH Tab 8'),
 qm(['PWR1'],'PWR1 or PWR2 may also illuminate for NR:',['Below 94.3 % (250 rpm) or above 107.5 % (285 rpm)','Below 83 % only','Above 117 %','Between 94 and 101 %'],'Note in the governing malfunction procedure.','QRH Tab 8, note'),
 qm(['DIFF','#N1 65.0 %','PWR2','GOV'],'DIFF NG + PWR + GOV: failure of the free turbine governing sensor. Action?',['Single engine failure procedure (Tab 4); if flight continued, intentional SE shutdown (Tab 5) — '+URG.LD,'Continue the flight','Restart the engine','Land immediately'],'And do not restart it later (Tab 6 caution).','QRH Tab 9'),
 qm(['DIFF','#N1 0.0 %','OVSP'],'Engine stopped due to N2 overspeed. Before any relight you must:',['Visually check the transmission between free turbine and rotor if any doubt; press OVSP.1/OVSP.2 to reset (no relight while light flashes)','Relight immediately','Pull the cut-out handle','Nothing'],'Single engine failure procedure, LIMIT DURATION.','QRH Tab 9'),
 qm(['OVSP'],'OVSP steady: loss of redundancy or overspeed protection default. Urgency?',[URG.CF,URG.LD,URG.LA,URG.LI],'QRH Tab 9.','QRH Tab 9'),
 qm(['GOV'],'GOV alone (minor governing failure). Correct statement?',['No effect on power level, but probability of a major failure is increased — '+URG.CF,'Engine at 85 % fixed — land','Shut down the engine','Limit duration of flight'],'Loss of redundancy.','QRH Tab 9'),
 qm(['DEICE'],'Failure of anti-icing engine air intakes. Action?',['Minimize flight time at OAT below +3 °C with visible humidity; set the engine air intake anti-icing switch OFF; check DEICE off — '+URG.CF,'Land immediately','Shut down the engine','Increase power'],'Engine flameout possible due to ice or snow ingestion.','QRH Tab 9'),
 qm(['E1CH'],'ENG1 CH (VMS working normally). Action?',['Watch engine parameters (N1, TOT, oil T and P) — '+URG.CF,'Reduce power; fuel flow control to fast reduction gate — '+URG.LD,'Land immediately','Shut down with the fuel shutoff valve'],'RFM 3.6 §7. After landing check the magnetic plug. The "reduce power + fast reduction gate + LIMIT DURATION" action is RFM 3.3 §7.2, after TOTAL VMS FAILURE — QRH Rev 1.0 shows only that version.','RFM 3.6 §7 / QRH Tab 10'),
 qm(['BLD'],'Bleed valve jammed OPEN. Consequences?',['Fuel consumption increased, power limited to MCR, thermal fatigue increased — '+URG.CF,'Surge hazard — avoid tailwind','Engine shutdown required','Land immediately'],'BLD seen for N1 above 88.2 % (BLD+OFS above 95.5 %).','QRH Tab 10'),
 qm([],'Bleed valve jammed CLOSED. What to avoid?',['Fast engine acceleration and downwind flight (surge hazard)','Hover','Climb above 10,000 ft','Using AFCS'],'CONTINUE THE FLIGHT.','QRH Tab 10'),
 qm(['PWCPT'],'PW CPT. Which lights remain valid?',['Only PWR1 or PWR2 for an active failure of the power regulation system; DIFF NG no longer driven by the power computer','DIFF NG only','All lights unchanged','None'],'Monitor engine parameters — CONTINUE THE FLIGHT.','QRH Tab 11'),
 qm(['TRNG'],'Failure on training card (PMU): TRNG + T. Effect?',['Engine 2 limited to N1 = 99.4 % and OEI limits shifted on the N1 display; check training switch OFF','Engine 1 shut down','Both engines at 85 %','No effect'],'CONTINUE THE FLIGHT.','QRH Tab 11'),
 qm([],'Collective pitch transmitter failure is indicated when the discrepancy exceeds:',['1.6°','0.5°','3°','5°'],'Collective pitch computed by the AFCS is displayed. CONTINUE.','QRH Tab 11'),
 qm([],'Automatic starting device failure: TOT is kept below what value in continuous operation?',['750 °C','500 °C','795 °C','850 °C'],'Release START at N1 40–45 %, lever forward until ≈65 % N1.','QRH Tab 11'),
 qm(['CAUT','FUEL','PRESS','#FUEL P 0.3 BAR'],'Low fuel pressure. Action and limit?',['Check booster pumps ON and CBs engaged — CONTINUE — altitude below 10,000 ft','Shut down the engine','Land immediately','Transfer fuel'],'Non-transferable fuel increases without booster pumps.','QRH Tab 12'),
 qm(['CAUT','FUEL','FILT'],'FILT illuminates. Actions?',['Try to extinguish by reducing power; if still on, intentional SE shutdown on that engine — LIMIT DURATION — DO NOT TRANSFER FUEL','Transfer fuel to the other group','Continue the flight','Pull the shutoff'],'If FILT of the other circuit comes on too: '+URG.LA+'.','QRH Tab 12'),
 qm(['LOWF'],'Fuel low level: pressing LONGI should show about how much in the feeder tank?',['90 litres (71 kg) — about 15 min at fast cruise, low altitude','60 litres','200 litres','30 litres'],'Keep the feeder tank reading not lower than 60 L (47 kg).','QRH Tab 12'),
 qt(['LOWF'],'At high nose-up attitude the fuel low-level light may come on even if total fuel is above 90 litres.',true,'Reduce nose-up attitude to improve ejector transfer, or transfer between groups.','QRH Tab 12')]},
{n:'Transmission & tail rotor',d:'Tabs 13–15',c:'#0e7490',q:[
 qm(['MGBP','MGBC','#OIL P 0.4 BAR'],'MGB P + MGB C: total loss of MGB oil or failure of both pumps. Action?',['Reduce power to obtain IAS = Vy — '+URG.LI,'Reduce power — '+URG.LA,URG.LD,URG.CF],'On ground in cold weather (OAT below −10 °C) MGB P may stay on after start — abort the start.','QRH Tab 13'),
 qm(['MGBC'],'MGB C alone (MGB oil cooling system fault). Actions?',['Reduce power; monitor MGB oil temperature and pressure on WCP','Land immediately','Shut down one engine','Continue at MCP'],'If MGB P lights: IAS = Vy, LAND IMMEDIATELY. If MGB T° lights: Tab 14.','QRH Tab 13'),
 qm(['#MGB OIL P 8.0 BAR'],'MGB oil pressure high (8.0 bar): partial filter clogging. Urgency?',[URG.LD,URG.LI,URG.LA,URG.CF],'Monitor MGB P on the WCP.','QRH Tab 13'),
 qm(['MGBT','#MGB T 145 °C'],'MGB T° on, VMS confirms 145 °C, power set for IAS = Vy, MGB T° stays on:',[URG.LA+' — maximum flight time 2 hours',URG.LD,URG.CF,URG.LI],'If MGB T° goes out at Vy: LIMIT DURATION. If VMS reading normal: CONTINUE.','QRH Tab 14'),
 qm(['MGBCH'],'MGB CH. First action?',['Set the chip detector control unit switch to CHIP PULSE','Land immediately','Reduce to Vy','Shut down engine 1'],'If MGB CH goes off: CONTINUE. If it stays on: reduce power (≤ level-flight power at Vy) — LIMIT DURATION.','QRH Tab 14'),
 qm([],'How many CHIP PULSE activations are permitted during a flight?',['One','Two','Three','Unlimited'],'After landing confirm by examining the plug.','QRH Tab 14, note'),
 qm(['IGBT'],'IGB T° or TGB T° on. Action?',['In cruise reduce collective pitch to about 14° — '+URG.LA,'Continue the flight',URG.LI,'Reduce to Vy — '+URG.LD],'Oil temperature exceeds 120 °C on IGB or TGB.','QRH Tab 14'),
 qm([],'Tail rotor control failure — symptoms?',['Uncommanded yaw and a stabilized sideslip of variable magnitude','Sudden strong yaw to the left','NR decay','TR vibration only'],'Control cable failure: a safety mechanism sets the blades to a safe pitch.','QRH Tab 15'),
 qm([],'Tail rotor control failure in hover/low speed IGE:',['Immediately reduce collective, cushion touchdown; then control yaw with wheel brakes, cut-out handle if appropriate','Increase collective and climb','Accelerate to 60 kt','Autorotate from height'],'QRH Tab 15.','QRH Tab 15'),
 qm([],'Tail rotor control failure in cruise: approach parameters?',['50–60 kt IAS, 9°–11° collective, ≈500 ft/min, slight sideslip to the left','Vy, 14° collective, 1000 ft/min','40 kt, 16°, hover landing','Autorotation at Vy + 10'],'First reduce collective to ≈13° and control heading with lateral cyclic; running landing.','QRH Tab 15'),
 qm([],'Tail rotor FAILURE (loss of thrust) — symptom and action?',['Sudden significant yaw to the left — immediately begin autorotation; full autorotation landing, engines shut down, highest ground speed compatible with the site','Slow yaw — reduce collective to 13°','Right yaw — increase power','No yaw — continue'],'After touchdown control yaw with wheel brakes; cut-out handle if appropriate.','QRH Tab 15')]},
{n:'Hydraulics & landing gear',d:'Tabs 16–19',c:'#4d7c0f',q:[
 qm(['HYD','CAUT'],'Three basic hydraulic failure types per QRH?',['Pressure drop, fluid leakage, seizing of a servo-control distributor valve','Overheat, leak, vibration','Pump noise, low level, high pressure','Filter clog, leak, cavitation'],'Loss of one cylinder: control remains with the second cylinder.','QRH Tab 16'),
 qm(['RHP','SERVO','#RH P 000 BAR'],'RH system pressure drop:',[URG.LA,URG.LI,URG.LD,URG.CF],'QRH Tab 16.','QRH Tab 16'),
 qm(['LHHMP','AUXP'],'LH (main) system pressure drop. Action?',['EMERGENCY LANDING GEAR EXTENSION — '+URG.LA,'AUX.P OFF — continue','AP HYD OFF — continue',URG.LI],'Main system backed up by the auxiliary system (110–140 bar).','QRH Tab 16'),
 qm(['AUXHP','#AUX 27 BAR'],'Auxiliary system pressure drop / aux pump failure:',['Press AUX.P pushbutton OFF — '+URG.CF,'Emergency gear extension — '+URG.LA,URG.LI,'AP HYD OFF'],'QRH Tab 16.','QRH Tab 16'),
 qm(['RHLEV','SERVO'],'RH reservoir low fluid level (<2 L). Consequence and urgency?',['Loss of one cylinder of tail servo controls — '+URG.LA,'Total loss of hydraulics — '+URG.LI,'No consequence — '+URG.CF,'Loss of landing gear — '+URG.LD],'With RH.P + 000 bar: total RH system failure, same urgency.','QRH Tab 16'),
 qm(['LHLEV','APHP','SERVO'],'LH reservoir low level. Consequences?',['Loss of one tail servo cylinder, loss of AP hydraulics, loss of normal gear extension, braking limited to ancillary accumulator','Only loss of AP','Loss of both main servo cylinders','No effect'],'AP HYD OFF, emergency gear extension, LAND ASAP.','QRH Tab 17'),
 qm(['LHLEV','APHP','SERVO'],'Before landing with LH reservoir low level, ensure ancillary accumulator pressure is at least:',['120 bar','80 bar','90 bar','210 bar'],'CAUTION: below 120 bar consider wheel and rotor braking lost.','QRH Tab 17'),
 qm(['LHP','LHLEV','LHHMP','APHP','AUXHP','AUXP','SERVO','#LH P 000 BAR'],'LH reservoir low level and zero pressure in LH system. Actions?',['AUX.P OFF, AP HYD OFF, emergency gear extension — '+URG.LA,'AP HYD OFF only — continue',URG.LI,'AUX.P ON — continue'],'Total LH system failure.','QRH Tab 18'),
 qm(['APHP'],'AP.HP alone (pressure drop in AP hydraulic system):',['AP HYD switch (collective) OFF — '+URG.CF,URG.LA,'Emergency gear extension','AUX.P OFF'],'QRH Tab 18.','QRH Tab 18'),
 qm(['#HYD 215 BAR'],'Over-pressure in RH or LH hydraulic system (or steady yellow-zone indication):',[URG.LD,URG.LA,URG.LI,URG.CF],'SERVO alone (servo command malfunction) is also LIMIT DURATION.','QRH Tab 18'),
 qm(['SERVO'],'SERVO alone:',[URG.LD,URG.LA,URG.LI,URG.CF],'Servo command system malfunction.','QRH Tab 18'),
 qm([],'Emergency L/G extension: full extension takes approximately:',['2 minutes','10 seconds','30 seconds','5 minutes'],'Handle PULL → PUMP light → selector down → 3 greens → handle down → PUMP off.','QRH Tab 19'),
 qm([],'After emergency extension one green arrow is missing. How can downlock be checked?',['Reduce IAS below 60 kt: if L/G does not illuminate, the gear can be considered fully extended','Recycle the gear','Pull the cut-out','Land on the nose wheel'],'Main gear units extend desynchronized in emergency extension.','QRH Tab 19, note'),
 qm([],'Landing gear retraction failure. Actions?',['Selector down, land and taxi a short distance in a straight line to centre the nose gear, take off and try again; if unsuccessful, no further attempts','Pull emergency handle','Continue with gear in transit','Cycle the gear 5 times'],'Gear down impairs level-flight speed and fuel consumption.','QRH Tab 19'),
 qm([],'Landing with gear up — before crew actions:',['Hover over a level site at minimum safe fuel; parking brake applied, side doors (except stairway) opened, passengers evacuate','Land at high speed on grass','Jettison doors in flight','Autorotate'],'Crew: ease onto ground, collective minimum, cut-out handle, rotor brake, leave when rotor stopped.','QRH Tab 19')]},
{n:'Electrical system',d:'Tabs 20–25',c:'#a16207',q:[
 qm(['CAUT','ELEC'],'Reset policy in electrical failures?',['If an item is to be reset, do not perform more than one attempt','Up to three attempts','Never reset','Reset every 5 minutes'],'CAUTION at the start of the electrical chapter.','QRH Tab 20'),
 qm(['BATL'],'Main battery failure. First action?',['EMERG BATT switch FORCED, then try to reset BATT.EXT.PWR','Gangbar AFT','Land immediately','TR.1 OFF'],'If BAT lights stay on: BATT.EXT.PWR OFF; if they go out: EMERG BATT NORM. CONTINUE.','QRH Tab 20'),
 qm(['BATL'],'Main battery failure: which is lost (circuits directly on PP1/PP11)?',['Engine starting, engine RH booster pumps, standby signalling panel, fire extinguisher, emergency L/G extension, VHF 2','Both TRs','AFCS','All lighting'],'Essential and secondary bars remain supplied by the two TRs.','QRH Tab 20'),
 qm(['BATT'],'BAT T° stays on after EMERG BATT FORCED and BATT.EXT.PWR OFF:',[URG.LA,URG.LD,URG.LI,URG.CF],'If it goes out: LIMIT DURATION.','QRH Tab 20'),
 qm([],'Total DC failure: emergency battery takes over its consumers. What happens to N1?',['N1 is fixed to 85 %','Engines shut down','N1 at idle','No change'],'Note in Tab 20.','QRH Tab 20, note'),
 qm(['TR2','BATL','IBAR','SPLYA','SHED'],'Essential bus DC short-circuit. Order of actions?',['BAT switch of EMERG CUT-OFF bar AFT, TR.2 OFF, COUPLING OFF — keep BATT.EXT.PWR ON — emergency gear extension — '+URG.LA,'TR.1 OFF, COUPLING OFF — limit duration','Gangbar fully AFT, BATT.EXT.PWR OFF','ALT.1 OFF, do not rearm'],'Battery below 22 V: total electrical failure may be imminent — configure for 85 % N1.','QRH Tab 21'),
 qm(['TR1','IBAR'],'Secondary bus DC short-circuit. Actions?',['TR.1 OFF, COUPLING OFF — keep BATT.EXT.PWR ON — '+URG.LD,'TR.2 OFF — land ASAP','BAT AFT — emergency gear','Continue without action'],'PITOTS (+ HYD on ground) illuminate.','QRH Tab 21'),

  btns.forEach((b,j)=>{b.disabled=true;if(c.opts[j]==right)b.classList.add('good');else if(j==i)b.classList.add('bad')});
  if(ok){setTimeout(()=>{if(L&&L.cur===c)advance()},550)}
  else{c.err++;const f=$('fb');f.style.display='';fb(false,(i<0?'Time is up. ':'')+`Next item: <b>${tx(right)}</b>`,'',d.r,'advance()')}}
function advance(){
  const c=L.cur;c.step++;c.opts=null;L.checked=false;
  if(c.step>=c.d.s.length)return endDrill();
  renderD()}
function endDrill(){
  const c=L.cur,ok=c.err==0;L.checked=true;
  P.ans++;if(ok)P.ok++;
  if(!L.seen[c.id]){L.seen[c.id]=1;upd(c.id,ok)}
  L.q.shift();
  if(ok){L.xp+=15;L.done++}else{L.err++;L.q.push(prep(ALL[c.id]))}
  save();
  const f=$('fb');f.style.display='';
  fb(ok,ok?'All items correct.':`Errors: ${c.err}. It will come again at the end.`,'',c.d.r,'next()')}
function finish(){
  clr();const m=L.meta;
  P.xp+=L.xp;const t=today();
  if(P.last!=t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);P.streak=P.last==y?P.streak+1:1;P.last=t}
  save();
  const acc=Math.round((L.n/(L.n+L.err))*100);
  const title=m.drill?'Drill complete':m.lamps?'Annunciators done':m.rev?'Review done':m.cards?'Limits done':m.mix?'Done':'Chapter done';
  $('quiz').innerHTML=`<div class="qin end"><div class="big">🏁</div><h2>${title}</h2>
  <div class="cards"><div><b>+${L.xp}</b><span>XP</span></div><div><b>${acc}%</b><span>accuracy</span></div><div><b>🔥${P.streak}</b><span>day streak</span></div></div>
  <button class="btn full" onclick="quit()">Continue</button></div>`}
function quit(){clr();$('quiz').classList.remove('on');L=null;home()}
home();
</script></body></html>
