plugins { id 'com.android.application' }

android {
    namespace 'uz.as532.trainer'
    compileSdk 34

    defaultConfig {
        applicationId "uz.as532.trainer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
