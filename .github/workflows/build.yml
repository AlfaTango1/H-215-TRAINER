name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Find the Android project
        run: |
          # If only the zip was uploaded, unpack it
          if [ -z "$(find . -name settings.gradle -not -path './.git/*' | head -1)" ]; then
            for z in $(find . -name '*.zip' -not -path './.git/*'); do
              echo "Unzipping $z"; unzip -o -q "$z" -d .
            done
          fi
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle not found. Upload ALL files from the AS532Trainer folder (app, gradle, build.gradle, settings.gradle, gradle.properties)."
            echo "Files in the repository:"; find . -not -path './.git/*' | head -100
            exit 1
          fi
          D=$(dirname "$F")
          echo "Project folder: $D"
          echo "PROJ=$D" >> "$GITHUB_ENV"
          if [ ! -f "$D/app/src/main/assets/index.html" ]; then
            echo "::error::app/src/main/assets/index.html is missing — upload the app folder completely."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" AS532-Trainer.apk

      - name: Save APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AS532-Trainer-apk
          path: AS532-Trainer.apk

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AS 532 Trainer - build ${{ github.run_number }}
          files: AS532-Trainer.apk
          make_latest: true
